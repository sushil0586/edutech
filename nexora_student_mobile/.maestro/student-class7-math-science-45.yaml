appId: ${MAESTRO_APP_ID}
---
# Required env:
# STUDENT_USERNAME
# STUDENT_PASSWORD
# EXAM_SEARCH

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Login"
    timeout: 30000

- tapOn: "Login"
- tapOn:
    id: "login-username-input"
- inputText: ${STUDENT_USERNAME}

- tapOn:
    id: "login-password-input"
- inputText: ${STUDENT_PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Sign in and continue learning"

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible: "Student Dashboard"
    timeout: 30000

- tapOn:
    id: "dashboard-open-exams-button"

- extendedWaitUntil:
    visible: "Student Exams"
    timeout: 30000

- scrollUntilVisible:
    element:
      id: "exams-filter-startable-button"
    direction: DOWN

- tapOn:
    id: "exams-filter-startable-button"

- scrollUntilVisible:
    element:
      id: "exams-open-top-exam-button"
    direction: UP
    visibilityPercentage: 70

- tapOn:
    id: "exams-open-top-exam-button"

- assertVisible: "Exam Readiness"
- assertVisible: "Start Attempt"
- assertVisible: "45"

- tapOn:
    id: "exam-detail-primary-action-button"

- extendedWaitUntil:
    visible: "Current question"
    timeout: 30000

- scrollUntilVisible:
    element: "Current question"
    direction: DOWN

- assertVisible: "Current question"

- scrollUntilVisible:
    element:
      id: "attempt-runtime-submit-button"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 70

- tapOn:
    id: "attempt-runtime-submit-button"

- scrollUntilVisible:
    element: "Ready to submit?"
    direction: DOWN

- scrollUntilVisible:
    element:
      id: "attempt-runtime-submit-now-button"
    direction: DOWN

- tapOn:
    id: "attempt-runtime-submit-now-button"

- extendedWaitUntil:
    visible: "Attempt Summary"
    timeout: 30000

- assertVisible: "Attempt Summary"
- assertVisible: "Submission state"
- assertVisible: "What happens next"
