appId: ${MAESTRO_APP_ID}
---
# Set these before running:
# STUDENT_USERNAME
# STUDENT_PASSWORD

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Student Dashboard|Login"
    timeout: 30000

- runFlow:
    when:
      visible: "Student Dashboard"
    commands:
      - tapOn:
          id: "student-tab-profile"
      - extendedWaitUntil:
          visible:
            id: "profile-logout-button"
          timeout: 30000
      - tapOn:
          id: "profile-logout-button"
      - extendedWaitUntil:
          visible:
            id: "role-gate-login-button"
          timeout: 30000

- extendedWaitUntil:
    visible:
      id: "role-gate-login-button"
    timeout: 30000

- tapOn:
    id: "role-gate-login-button"

- extendedWaitUntil:
    visible:
      id: "login-username-input"
    timeout: 30000

- tapOn:
    id: "login-username-input"
- inputText: ${STUDENT_USERNAME}

- tapOn:
    id: "login-password-input"
- inputText: ${STUDENT_PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Sign in and continue learning"

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible: "Student Dashboard"
    timeout: 30000

- extendedWaitUntil:
    notVisible: "Loading live dashboard data..."
    timeout: 30000

- takeScreenshot: "01-dashboard"

- tapOn:
    id: "dashboard-open-exams-button"

- assertVisible: "Student Exams"

- extendedWaitUntil:
    notVisible: "Loading the live exam catalog..."
    timeout: 30000

- takeScreenshot: "02-exams-top"

- scrollUntilVisible:
    element:
      id: "exams-filter-startable-button"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 70

- tapOn:
    id: "exams-filter-startable-button"

- scrollUntilVisible:
    element:
      id: "exams-open-top-exam-button"
    direction: UP
    timeout: 30000
    visibilityPercentage: 70

- tapOn:
    id: "exams-open-top-exam-button"

- extendedWaitUntil:
    visible: "Exam Readiness"
    timeout: 30000

- takeScreenshot: "03-exam-readiness"

- tapOn:
    id: "exam-detail-open-exams-button"

- assertVisible: "Student Exams"
- tapOn:
    id: "student-tab-attempts"

- assertVisible: "Student Attempts"
- takeScreenshot: "04-attempts-top"

- scrollUntilVisible:
    element: "Resume now"
    direction: DOWN

- takeScreenshot: "05-attempts-resume"

- tapOn:
    id: "student-tab-results"

- assertVisible: "Student Results"
- takeScreenshot: "06-results-top"

- scrollUntilVisible:
    element: "Results timeline"
    direction: DOWN
    timeout: 60000
    speed: 70
    visibilityPercentage: 70

- takeScreenshot: "07-results-timeline"

- tapOn:
    id: "student-tab-analytics"

- assertVisible: "Student Analytics"
- takeScreenshot: "08-analytics-top"

- scrollUntilVisible:
    element: "Next action"
    direction: DOWN

- takeScreenshot: "09-analytics-action"

- tapOn:
    id: "student-tab-profile"

- assertVisible: "Student Profile"
- takeScreenshot: "10-profile-top"
