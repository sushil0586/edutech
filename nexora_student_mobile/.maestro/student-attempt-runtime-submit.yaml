appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Login"
    timeout: 30000

- tapOn: "Login"
- tapOn:
    id: "login-username-input"
- inputText: a001

- tapOn:
    id: "login-password-input"
- inputText: Ansh@1789
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Sign in and continue learning"

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible: "Student Dashboard"
    timeout: 30000

- tapOn:
    id: "dashboard-open-attempts-button"

- extendedWaitUntil:
    visible: "Student Attempts"
    timeout: 30000

- scrollUntilVisible:
    element:
      text: "Resume Attempt"
    direction: DOWN
    visibilityPercentage: 70

- tapOn:
    text: "Resume Attempt"

- extendedWaitUntil:
    visible: "Current question"
    timeout: 30000

- scrollUntilVisible:
    element: "Current question"
    direction: DOWN
    visibilityPercentage: 70

- assertVisible: "Current question"

- scrollUntilVisible:
    element:
      id: "attempt-runtime-submit-button"
    direction: DOWN
    visibilityPercentage: 70

- tapOn:
    id: "attempt-runtime-submit-button"

- scrollUntilVisible:
    element: "Ready to submit?"
    direction: DOWN

- assertVisible: "Ready to submit?"
- assertVisible: "Continue Attempt"

- scrollUntilVisible:
    element:
      id: "attempt-runtime-submit-now-button"
    direction: DOWN

- tapOn:
    id: "attempt-runtime-submit-now-button"

- extendedWaitUntil:
    visible: "Attempt Summary"
    timeout: 30000

- assertVisible: "Attempt Summary"
- assertVisible: "Submission state"
- assertVisible: "What happens next"
