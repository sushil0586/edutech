appId: ${MAESTRO_APP_ID}
---
# Set these before running:
# STUDENT_USERNAME
# STUDENT_PASSWORD
#
# Seed expectation:
# - the student account has at least one review-ready result

- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Student Dashboard"
    commands:
      - tapOn:
          id: "student-tab-profile"
      - extendedWaitUntil:
          visible:
            id: "profile-logout-button"
          timeout: 30000
      - tapOn:
          id: "profile-logout-button"
      - extendedWaitUntil:
          visible:
            id: "role-gate-login-button"
          timeout: 30000

- extendedWaitUntil:
    visible:
      id: "role-gate-login-button"
    timeout: 30000

- tapOn:
    id: "role-gate-login-button"

- extendedWaitUntil:
    visible:
      id: "login-username-input"
    timeout: 30000

- tapOn:
    id: "login-username-input"
- inputText: ${STUDENT_USERNAME}

- tapOn:
    id: "login-password-input"
- inputText: ${STUDENT_PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Sign in and continue learning"

- scrollUntilVisible:
    element:
      id: "login-submit-button"
    direction: DOWN

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible: "Student Dashboard"
    timeout: 120000

- tapOn:
    id: "dashboard-open-attempts-button"

- extendedWaitUntil:
    visible: "Student Attempts"
    timeout: 30000

- scrollUntilVisible:
    element:
      id: "attempts-open-results-button"
    direction: DOWN

- tapOn:
    id: "attempts-open-results-button"

- extendedWaitUntil:
    visible: "Student Results"
    timeout: 30000

- scrollUntilVisible:
    element: "Review"
    direction: DOWN

- tapOn: "Review"

- assertVisible: "Attempt Review"

- tapOn:
    id: "attempt-review-back-summary-button"

- assertVisible: "Attempt Summary"

- tapOn:
    id: "attempt-summary-open-results-button"

- assertVisible: "Student Results"
