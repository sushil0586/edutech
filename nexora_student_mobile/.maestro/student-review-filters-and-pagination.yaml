appId: ${MAESTRO_APP_ID}
---
# Frozen case: EXPO-P1-005
# Set these before running:
# STUDENT_USERNAME
# STUDENT_PASSWORD
#
# Seed expectation:
# - the student account has at least one review-ready result
# - that review exposes at least 9 review questions
# - the review includes at least one incorrect, skipped, or marked item

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "role-gate-login-button"
    timeout: 60000

- tapOn:
    id: "role-gate-login-button"
- tapOn:
    id: "login-username-input"
- inputText: ${STUDENT_USERNAME}

- tapOn:
    id: "login-password-input"
- inputText: ${STUDENT_PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Sign in and continue learning"

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible: "Student Dashboard"
    timeout: 60000

- tapOn:
    id: "student-tab-results"

- extendedWaitUntil:
    visible: "Student Results"
    timeout: 60000

- scrollUntilVisible:
    element:
      id: "results-review-button"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 70
    centerElement: true

- tapOn:
    id: "results-review-button"

- extendedWaitUntil:
    visible: "Attempt Review"
    timeout: 60000

- scrollUntilVisible:
    element:
      id: "attempt-review-filter-incorrect-button"
    direction: DOWN
    visibilityPercentage: 70

- tapOn:
    id: "attempt-review-filter-incorrect-button"

- tapOn:
    id: "attempt-review-filter-skipped-button"

- tapOn:
    id: "attempt-review-filter-marked-button"

- tapOn:
    id: "attempt-review-filter-all-button"

- scrollUntilVisible:
    element:
      id: "attempt-review-next-page-button"
    direction: DOWN
    speed: 80
    timeout: 60000
    visibilityPercentage: 1

- tapOn:
    id: "attempt-review-next-page-button"

- scrollUntilVisible:
    element:
      id: "attempt-review-previous-page-button"
    direction: DOWN
    speed: 80
    timeout: 60000
    visibilityPercentage: 70

- takeScreenshot: expo-p1-005-review-page-two

- tapOn:
    id: "attempt-review-previous-page-button"

- scrollUntilVisible:
    element:
      id: "attempt-review-back-summary-button"
    direction: UP
    speed: 80
    timeout: 60000
    visibilityPercentage: 70

- tapOn:
    id: "attempt-review-back-summary-button"

- extendedWaitUntil:
    visible: "Attempt Summary"
    timeout: 60000

- tapOn:
    id: "attempt-summary-open-results-button"

- extendedWaitUntil:
    visible: "Student Results"
    timeout: 60000

- takeScreenshot: expo-p1-005-returned-to-results
