appId: ${MAESTRO_APP_ID}
---
# Set these before running:
# STUDENT_USERNAME
# STUDENT_PASSWORD
#
# Seed expectation:
# - the student account can log in successfully
# - at least one exam is visible in the exams lane
# - at least one exam detail route opens from the current scope

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Login"
    timeout: 30000

- tapOn: "Login"
- tapOn:
    id: "login-username-input"
- inputText: ${STUDENT_USERNAME}

- tapOn:
    id: "login-password-input"
- inputText: ${STUDENT_PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Sign in and continue learning"

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible: "Student Dashboard"
    timeout: 30000

- tapOn:
    id: "dashboard-open-exams-button"

- assertVisible: "Student Exams"
- assertVisible: "Find the right exam"

- scrollUntilVisible:
    element:
      id: "exams-filter-resume-button"
    direction: DOWN

- tapOn:
    id: "exams-filter-resume-button"

- tapOn:
    id: "exams-filter-startable-button"

- tapOn:
    id: "exams-filter-locked-button"

- tapOn:
    id: "exams-filter-reset-button"

- tapOn:
    id: "exams-search-input"
- inputText: "math"
- tapOn: "Find the right exam"

- tapOn:
    id: "exams-filter-reset-button"

- scrollUntilVisible:
    element:
      id: "exams-open-top-exam-button"
    direction: UP

- tapOn:
    id: "exams-open-top-exam-button"

- assertVisible: "Exam Readiness"
- assertVisible: "Readiness overview"

- tapOn:
    id: "exam-detail-open-exams-button"

- assertVisible: "Student Exams"
