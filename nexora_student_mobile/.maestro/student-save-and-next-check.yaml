appId: com.anonymous.nexorastudentmobile
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Login"
    timeout: 30000

- tapOn: "Login"
- tapOn:
    text: "Username"
- inputText: a001

- tapOn:
    text: "Enter password"
- inputText: Ansh@1789

- hideKeyboard
- tapOn: "Login"

- extendedWaitUntil:
    visible: "Student Dashboard"
    timeout: 30000

- tapOn:
    id: "dashboard-open-attempts-button"

- extendedWaitUntil:
    visible: "Student Attempts"
    timeout: 30000

- scrollUntilVisible:
    element:
      id: "attempts-resume-attempt-button"
    direction: DOWN

- tapOn:
    id: "attempts-resume-attempt-button"

- extendedWaitUntil:
    visible: "Live Attempt"
    timeout: 30000

- scrollUntilVisible:
    element: "Current question"
    direction: DOWN

- scrollUntilVisible:
    element: "Save Answer"
    direction: DOWN

- assertVisible: "Selected A"
- assertVisible: "Saved choice: Option A - It cannot be compared"

- tapOn: "Select B"

- assertVisible: "Selected B"

- tapOn:
    id: "attempt-runtime-save-answer-button"

- extendedWaitUntil:
    visible: "A rope is 28 m long. If 3/4 of it is used, how many metres remain?"
    timeout: 10000
