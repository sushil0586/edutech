appId: com.anonymous.nexorastudentmobile
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Login"
    timeout: 30000

- tapOn: "Login"
- tapOn:
    text: "Username"
- inputText: a001

- tapOn:
    text: "Enter password"
- inputText: Ansh@1789

- hideKeyboard
- tapOn: "Login"

- extendedWaitUntil:
    visible: "Student Dashboard"
    timeout: 30000

- tapOn:
    id: "dashboard-open-attempts-button"

- assertVisible: "Student Attempts"
- assertVisible: "Return to live work or inspect completed attempts"
- assertVisible: "Resume now"
- assertVisible: "Open Results"
