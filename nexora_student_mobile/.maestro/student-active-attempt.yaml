appId: ${MAESTRO_APP_ID}
---
# Frozen case: EXPO-P1-006
# Set these before running:
# STUDENT_USERNAME
# STUDENT_PASSWORD

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "role-gate-login-button"
    timeout: 60000

- tapOn:
    id: "role-gate-login-button"
- tapOn:
    id: "login-username-input"
- inputText: ${STUDENT_USERNAME}

- tapOn:
    id: "login-password-input"
- inputText: ${STUDENT_PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Sign in and continue learning"

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible: "Student Dashboard"
    timeout: 60000

- tapOn:
    id: "dashboard-open-attempts-button"

- extendedWaitUntil:
    visible: "Student Attempts"
    timeout: 60000
- assertVisible: "Return to live work or inspect completed attempts"
- assertVisible: "Resume now"
- assertVisible: "Open Results"

- takeScreenshot: expo-p1-006-attempts-lane
