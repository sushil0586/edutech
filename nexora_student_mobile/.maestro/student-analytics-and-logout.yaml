appId: ${MAESTRO_APP_ID}
---
# Set these before running:
# STUDENT_USERNAME
# STUDENT_PASSWORD
#
# Seed expectation:
# - the student account can log in successfully
# - analytics lane is reachable for the signed-in student
# - profile lane is reachable and logout returns to the unauthenticated role gate

- launchApp:
    clearState: true

- runFlow:
    when:
      visible: "Student Dashboard"
    commands:
      - tapOn:
          id: "student-tab-profile"
      - extendedWaitUntil:
          visible:
            id: "profile-logout-button"
          timeout: 30000
      - tapOn:
          id: "profile-logout-button"
      - extendedWaitUntil:
          visible:
            id: "role-gate-login-button"
          timeout: 30000

- tapOn:
    id: "role-gate-login-button"

- extendedWaitUntil:
    visible:
      id: "login-username-input"
    timeout: 30000

- tapOn:
    id: "login-username-input"
- inputText: ${STUDENT_USERNAME}

- tapOn:
    id: "login-password-input"
- inputText: ${STUDENT_PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Sign in and continue learning"

- scrollUntilVisible:
    element:
      id: "login-submit-button"
    direction: DOWN

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible: "Student Dashboard"
    timeout: 30000

- tapOn:
    id: "student-tab-analytics"

- extendedWaitUntil:
    visible:
      id: "analytics-open-results-button"
    timeout: 30000

- assertVisible: "Student Analytics"
- assertVisible: "Understand progress without overload"
- assertVisible: "Next action"

- tapOn:
    id: "analytics-open-results-button"

- assertVisible: "Student Results"

- tapOn:
    id: "student-tab-profile"

- assertVisible: "Student Profile"
- assertVisible: "Account details"
- assertVisible: "Open Dashboard"
- assertVisible: "Logout"

- tapOn:
    id: "profile-logout-button"

- extendedWaitUntil:
    visible: "No active mobile session yet"
    timeout: 30000

- assertVisible: "Continue into the student lane"
- assertVisible: "Login"
