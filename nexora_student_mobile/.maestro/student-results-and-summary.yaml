appId: com.anonymous.nexorastudentmobile
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Login"
    timeout: 30000

- tapOn: "Login"
- tapOn:
    text: "Username"
- inputText: a001

- tapOn:
    text: "Enter password"
- inputText: Ansh@1789

- hideKeyboard
- tapOn: "Login"

- extendedWaitUntil:
    visible: "Student Dashboard"
    timeout: 30000

- tapOn:
    id: "dashboard-open-attempts-button"

- extendedWaitUntil:
    visible: "Student Attempts"
    timeout: 30000

- scrollUntilVisible:
    element:
      id: "attempts-open-results-button"
    direction: DOWN

- tapOn:
    id: "attempts-open-results-button"

- extendedWaitUntil:
    visible: "Student Results"
    timeout: 30000

- scrollUntilVisible:
    element:
      id: "results-summary-button"
    direction: DOWN

- tapOn:
    id: "results-summary-button"

- extendedWaitUntil:
    visible: "Attempt Summary"
    timeout: 30000

- tapOn:
    id: "attempt-summary-back-dashboard-button"

- assertVisible: "Student Dashboard"

- tapOn: "Attempts"

- assertVisible: "Student Attempts"
