appId: ${MAESTRO_APP_ID}
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Login"
    timeout: 30000

- tapOn: "Login"
- tapOn:
    id: "login-username-input"
- inputText: a001

- tapOn:
    id: "login-password-input"
- inputText: Ansh@1789
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Sign in and continue learning"

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible: "Student Dashboard"
    timeout: 30000

- tapOn:
    id: "dashboard-open-attempts-button"

- extendedWaitUntil:
    visible: "Student Attempts"
    timeout: 30000

- scrollUntilVisible:
    element: "Resume Attempt"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 50

- tapOn:
    text: "Resume Attempt"

- extendedWaitUntil:
    visible: "Current question"
    timeout: 30000

- scrollUntilVisible:
    element: "Current question"
    direction: DOWN
    visibilityPercentage: 70

- swipe:
    start: 50%, 85%
    end: 50%, 45%
    duration: 600

- tapOn: "Select C"
- assertVisible: "Selected C"

- scrollUntilVisible:
    element:
      id: "attempt-runtime-save-answer-button"
    direction: DOWN
    visibilityPercentage: 70
    timeout: 30000

- tapOn:
    id: "attempt-runtime-save-answer-button"

- extendedWaitUntil:
    visible: "Answer saved. Moving to the next question."
    timeout: 30000

- assertVisible: "Current question"
