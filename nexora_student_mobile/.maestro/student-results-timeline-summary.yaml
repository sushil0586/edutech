appId: ${MAESTRO_APP_ID}
---
# Set these before running:
# STUDENT_USERNAME
# STUDENT_PASSWORD
#
# Seed expectation:
# - the student account can log in successfully
# - at least one completed attempt exists
# - at least one summary route opens from the results lane

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: "Login"
    timeout: 30000

- tapOn: "Login"
- tapOn:
    id: "login-username-input"
- inputText: ${STUDENT_USERNAME}

- tapOn:
    id: "login-password-input"
- inputText: ${STUDENT_PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Sign in and continue learning"

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible: "Student Dashboard"
    timeout: 30000

- tapOn:
    id: "student-tab-results"

- assertVisible: "Student Results"
- scrollUntilVisible:
    element:
      id: "results-timeline-summary-button"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 50

- tapOn:
    id: "results-timeline-summary-button"

- assertVisible: "Attempt Summary"
- assertVisible: "Submission state"
- tapOn:
    id: "attempt-summary-open-analytics-button"

- assertVisible: "Student Analytics"

- tapOn:
    id: "student-tab-results"

- assertVisible: "Student Results"

- scrollUntilVisible:
    element:
      id: "results-timeline-summary-button"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 50

- tapOn:
    id: "results-timeline-summary-button"

- assertVisible: "Attempt Summary"
- assertVisible: "Submission state"
- scrollUntilVisible:
    element: "What happens next"
    direction: DOWN
