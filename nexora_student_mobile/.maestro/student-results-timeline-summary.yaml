appId: ${MAESTRO_APP_ID}
---
# Frozen case: EXPO-P1-003
# Set these before running:
# STUDENT_USERNAME
# STUDENT_PASSWORD
#
# Seed expectation:
# - the student account can log in successfully
# - at least one completed attempt exists
# - at least one summary route opens from the results lane

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible:
      id: "role-gate-login-button"
    timeout: 60000

- tapOn:
    id: "role-gate-login-button"
- tapOn:
    id: "login-username-input"
- inputText: ${STUDENT_USERNAME}

- tapOn:
    id: "login-password-input"
- inputText: ${STUDENT_PASSWORD}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Sign in and continue learning"

- tapOn:
    id: "login-submit-button"

- extendedWaitUntil:
    visible: "Student Dashboard"
    timeout: 30000

- tapOn:
    id: "student-tab-results"

- extendedWaitUntil:
    visible: "Student Results"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "results-timeline-summary-button"
    direction: DOWN
    speed: 80
    timeout: 60000
    visibilityPercentage: 70

- tapOn:
    id: "results-timeline-summary-button"

- extendedWaitUntil:
    visible: "Attempt Summary"
    timeout: 60000
- assertVisible: "Submission state"
- tapOn:
    id: "attempt-summary-open-analytics-button"

- extendedWaitUntil:
    visible: "Student Analytics"
    timeout: 60000

- tapOn:
    id: "student-tab-results"

- extendedWaitUntil:
    visible: "Student Results"
    timeout: 60000

- scrollUntilVisible:
    element:
      id: "results-timeline-summary-button"
    direction: DOWN
    speed: 80
    timeout: 60000
    visibilityPercentage: 70

- tapOn:
    id: "results-timeline-summary-button"

- extendedWaitUntil:
    visible: "Attempt Summary"
    timeout: 60000
- assertVisible: "Submission state"
- scrollUntilVisible:
    element: "What happens next"
    direction: DOWN

- takeScreenshot: expo-p1-003-results-timeline-summary
